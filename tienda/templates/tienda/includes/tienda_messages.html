{% if messages %}
<ul class="tienda-alert-list">
    {% for message in messages %}
    <li class="tienda-alert tienda-alert-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
        {{ message }}
    </li>
    {% endfor %}
</ul>
{% endif %}
